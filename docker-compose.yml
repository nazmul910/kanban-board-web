version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kanban_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanban_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/kanban_db?schema=public"
      JWT_ACCESS_SECRET: "fgsdfgsfg-adfladfa-adfadf"
      JWT_ACCESS_EXPIRES_IN: "7d"
      SALT_ROUNDS: 12
      FRONTEND_URL: "http://localhost:3000,https://kanban-task-todo.vercel.app"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kanban_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
